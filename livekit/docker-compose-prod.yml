
# Domain routing:
# livekit.yourdomain.com
#   → Nginx Proxy Manager :443
#   → livekit:7880 ผ่าน npm_network

# turn.yourdomain.com
#   → ชี้ Public IP ของเครื่องโดยตรง
#   → UDP 3478 = STUN และ TURN/UDP
#   → TCP 5349 = TURN/TLS เมื่อ UDP ใช้ไม่ได้
# ไม่ต้องสร้าง Proxy Host ใน NPM

# Client/Worker ใช้:
# LIVEKIT_URL=wss://livekit.yourdomain.com

services:
  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: livekit-server-prod
    restart: unless-stopped
    networks:
      - npm_network
      - livekit_internal
    ports:
      # WebRTC TCP fallback
      - "7881:7881/tcp"
      # TURN/UDP และ STUN
      - "3478:3478/udp"
      # TURN/TLS
      - "5349:5349/tcp"
      # WebRTC media UDP range
      - "50000-60000:50000-60000/udp"
    expose:
      # ให้ NPM proxy เข้า livekit:7880
      - "7880"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command:
      - --config
      - /etc/livekit/livekit.yaml
    volumes:
      - ./livekit-prod.yaml:/etc/livekit/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: livekit-redis-prod
    restart: unless-stopped
    networks:
      - livekit_internal
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data-prod:

networks:
  npm_network:
    external: true

  livekit_internal:
    internal: true